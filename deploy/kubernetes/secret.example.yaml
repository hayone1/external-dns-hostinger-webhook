# Example Secret for the Hostinger API token. Create the token in hPanel
# under Profile > API. Give it an expiry date.
#
# A Hostinger API token can do everything your account can do (servers,
# billing, domains), not only DNS. Treat it like your password.
#
# Do not commit a filled-in copy of this file. It is safer to create the
# Secret straight from your shell:
#
#   kubectl -n external-dns create secret generic hostinger-credentials \
#     --from-literal=api-token='...'
#
# or use a tool such as External Secrets Operator or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: hostinger-credentials
  namespace: external-dns
type: Opaque
stringData:
  api-token: "CHANGE-ME"
