version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests may use simple HTTP calls and fixed values.
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hayone1/external-dns-hostinger-webhook
