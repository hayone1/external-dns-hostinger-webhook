name: Feature request
description: Suggest an idea or a change.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Tell us what you want to do and why the webhook cannot do it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Describe the change. Examples of settings or annotations help a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you thought about
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some help"
        - "No"
    validations:
      required: true
