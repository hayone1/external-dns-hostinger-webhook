name: Bug report
description: Something does not work the way the docs say it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!
        **Security problem?** Do not use this form. Follow [SECURITY.md](https://github.com/hayone1/external-dns-hostinger-webhook/blob/main/SECURITY.md).
        **Never paste your Hostinger API token here.** A Hostinger token can do everything your account can do.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: The Kubernetes object (Service, Ingress, ...) with its annotations, and the steps you took.
      placeholder: |
        1. Create this Service: ...
        2. Wait one minute
        3. The record does not show up in Hostinger
    validations:
      required: true
  - type: input
    id: webhook-version
    attributes:
      label: Webhook version
      description: The image tag you run, for example v0.1.0.
    validations:
      required: true
  - type: input
    id: external-dns-version
    attributes:
      label: external-dns version and Helm chart version
      placeholder: external-dns v0.23.0, chart 1.23.0
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your configuration
      description: Your Helm values or external-dns flags and the webhook environment variables. **Remove all secrets first.**
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs from both containers, ideally with `LOG_LEVEL=debug` on the webhook:
        `kubectl -n external-dns logs deploy/external-dns -c webhook` and `-c external-dns`.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the [troubleshooting guide](https://github.com/hayone1/external-dns-hostinger-webhook/blob/main/docs/troubleshooting.md).
          required: true
        - label: I removed all secrets and tokens from this report.
          required: true
