name: End-to-end

# Runs real external-dns with this webhook in a kind cluster, against the
# fake Hostinger API (test/e2e/fakehostinger) running in the same cluster. It
# needs no secrets and no Hostinger account, so it is safe for every pull
# request, forks included. To test against the real Hostinger API, run
# test/e2e/run.sh with E2E_MODE=real on your own machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A fixed prefix: when the release workflow calls this one, github.workflow
# is "Release", and sharing its group would make the two wait for each other.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  e2e:
    name: kind + fake Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build webhook image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: external-dns-hostinger-webhook:e2e
          build-args: |
            VERSION=e2e
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Build fake Hostinger API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: test/e2e/fakehostinger/Dockerfile
          load: true
          tags: fake-hostinger:e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: e2e
      - name: Load images into kind
        run: kind load docker-image external-dns-hostinger-webhook:e2e fake-hostinger:e2e --name e2e
      - name: Run end-to-end test
        env:
          E2E_MODE: fake
          E2E_IMAGE: external-dns-hostinger-webhook:e2e
          E2E_FAKE_IMAGE: fake-hostinger:e2e
        run: |
          export E2E_ID="gh${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          ./test/e2e/run.sh
